<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3b2a6e"/>
      <stop offset="0.55" stop-color="#1c1538"/>
      <stop offset="1" stop-color="#0b0918"/>
    </radialGradient>
    <radialGradient id="brillo" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="escudo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fd6"/>
      <stop offset="1" stop-color="#16367a"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#e6a93a"/>
      <stop offset="1" stop-color="#9c6418"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#c9d2de"/>
      <stop offset="1" stop-color="#8794a6"/>
    </linearGradient>
    <linearGradient id="gema" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a7a"/>
      <stop offset="1" stop-color="#a3121f"/>
    </linearGradient>
    <linearGradient id="cinta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8202f"/>
      <stop offset="1" stop-color="#7a0f19"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>
  <circle cx="256" cy="225" r="230" fill="url(#brillo)"/>

  <!-- Espadas cruzadas detrás del escudo -->
  <g id="espada" transform="rotate(-38 256 230)">
    <polygon points="248,40 264,40 270,330 242,330" fill="url(#hoja)" stroke="#4a5262" stroke-width="3"/>
    <polygon points="256,22 248,40 264,40" fill="#f4f7fb" stroke="#4a5262" stroke-width="3"/>
    <rect x="206" y="330" width="100" height="18" rx="6" fill="url(#borde)" stroke="#5a3a0c" stroke-width="3"/>
    <rect x="247" y="348" width="18" height="52" rx="4" fill="#5b3a1e" stroke="#2e1d0d" stroke-width="3"/>
    <circle cx="256" cy="410" r="13" fill="url(#borde)" stroke="#5a3a0c" stroke-width="3"/>
  </g>
  <use href="#espada" transform="translate(512 0) scale(-1 1)"/>

  <!-- Escudo -->
  <path d="M256 92 L372 132 L366 262 Q356 352 256 410 Q156 352 146 262 L140 132 Z"
        fill="url(#borde)" stroke="#3d2606" stroke-width="5"/>
  <path d="M256 112 L354 146 L349 260 Q340 336 256 386 Q172 336 163 260 L158 146 Z"
        fill="url(#escudo)"/>
  <!-- Bloques (Blox) dentro del escudo -->
  <g stroke="#0e2457" stroke-width="3">
    <rect x="214" y="190" width="40" height="40" rx="4" fill="#4d8ff0"/>
    <rect x="258" y="190" width="40" height="40" rx="4" fill="#3a78dc"/>
    <rect x="236" y="234" width="40" height="40" rx="4" fill="#5b9cf6"/>
  </g>
  <!-- Gema -->
  <polygon points="256,128 276,150 256,176 236,150" fill="url(#gema)" stroke="#4a060c" stroke-width="3"/>
  <polygon points="256,134 266,150 256,150" fill="#ffd0d0" opacity="0.8"/>
  <!-- Corona de raid: picos en la punta del escudo -->
  <polygon points="236,300 246,318 256,296 266,318 276,300 272,334 240,334" fill="url(#borde)" stroke="#3d2606" stroke-width="3"/>

  <!-- Cinta con el nombre -->
  <path d="M60 392 L452 392 L432 424 L452 456 L60 456 L80 424 Z" fill="url(#cinta)" stroke="#3a060c" stroke-width="5"/>
  <text x="256" y="440" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
        font-size="46" fill="#ffe9a3" stroke="#3a060c" stroke-width="2" letter-spacing="3">RAIDBLOX</text>
</svg>
